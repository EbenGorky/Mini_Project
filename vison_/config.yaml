# ==========================================
# Helmet Vision Configuration
# ==========================================

camera:
  # Default ESP32-CAM IP (overridden by --ip CLI argument or UI input)
  default_ip: "192.168.1.50"
  # Standard ESP32-CAM CameraWebServer MJPEG stream port and path
  port: 81
  path: "/stream"
  # Reconnection settings
  reconnect_interval_sec: 3.0
  connection_timeout_sec: 5.0
  # Internal buffer size (1 keeps latency lowest)
  buffer_size: 1

display:
  window_title: "Helmet Vision - Construction Safety Monitor"
  target_width: 960
  target_height: 540
  show_stats: true
  show_control_bar: true
  font_scale: 0.6
  # Color theme (BGR)
  theme:
    bg_dark: [24, 24, 24]
    panel_bg: [40, 40, 40]
    border: [70, 70, 70]
    text: [240, 240, 240]
    accent: [255, 140, 0]      # Safety orange
    green: [50, 205, 50]       # Low risk / connected
    amber: [0, 191, 255]       # Medium risk / reconnecting
    red: [50, 50, 240]         # High risk / offline

video:
  # Loop playback when reaching EOF in video file mode
  loop: true
  target_fps: 30

# Detection settings (for Milestone 2+)
detection:
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.15
  iou_threshold: 0.40
  device: "cuda:0"             # Auto-detects and falls back to CPU
  imgsz: 640
  frame_skip: 0                # 0 = every frame on GPU
  max_missed_frames: 15        # Keep tracking alive across split-second missed frames (~600ms)
  min_iou_match: 0.18

# Temporal Confirmation Filter (Eliminates single-frame random glitches)
temporal_filtering:
  min_confirmation_frames: 2     # Consecutive frames required to confirm detection before drawing on screen
  marking_min_hits: 2            # Consecutive frames required for hazard tape & signs
  high_conf_fast_track: 0.55     # High-confidence detections (>0.55) confirm immediately (0ms latency)

# Hazard & Risk Rules (for Milestone 3-5)
hazards:
  smoothing_frames: 5
  zone_hold_frames: 15         # Hold drop zone steady across momentary detection drops
  suspended_load_safety_margin: 1.8
  ground_horizon_ratio: 0.75
  ground_bottom_ratio: 0.95
  rules:
    - condition: "crane_drop_zone_breach"
      risk_level: "High"
      message: "CRITICAL: Worker inside suspended load drop zone! Evacuate immediately!"
    - condition: "crane_overhead"
      risk_level: "Medium"
      message: "Crane load suspended overhead — keep lifting radius clear"
    - condition: "machinery_proximity"
      risk_level: "High"
      message: "Vehicle ahead, move clear of its path"
    - condition: "hazard_tape"
      risk_level: "High"
      message: "Hazard tape detected, do not cross"
    - condition: "no_entry_sign"
      risk_level: "High"
      message: "No-entry sign ahead, stop and check"
    - condition: "cone_line"
      risk_level: "Medium"
      message: "Cone line ahead, area restricted"
    - condition: "missing_ppe"
      risk_level: "Medium"
      message: "Person without required PPE in view"

# Markings & Sign Detection (Milestone 4)
# Classical HSV segmentation for physical hazard tape, cones, and safety signs.
# Set enabled to true when monitoring sites with yellow/black hazard tape or cones.
markings:
  enabled: false
  hazard_tape:
    yellow_hsv_lower: [18, 110, 100]
    yellow_hsv_upper: [34, 255, 255]
    min_contour_area: 1200
    min_aspect_ratio: 4.0
    proximity_y_ratio: 0.80
  cones:
    enabled: true
    min_contour_area: 500
  signs:
    enabled: true
    min_contour_area: 1000

# Alerts & Logging (for Milestone 5)
alerts:
  beep_on_high_risk: true
  beep_interval_sec: 3.0
  log_events: true
  log_dir: "logs"
  save_snapshots: true
  snapshot_cooldown_sec: 5.0

